version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: multitenant_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: multitenant_db
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres_admin -d multitenant_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
